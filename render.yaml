services:
  - type: web
    name: nai-tiaras
    runtime: docker
    plan: free
    envVars:
      # Banco temporário para testes; a Render apaga os dados ao reiniciar.
      - key: NAI_DB_PATH
        value: /tmp/naitiaras.db
      - key: NAI_ADMIN_EMAIL
        sync: false
      - key: NAI_ADMIN_PASSWORD
        sync: false
